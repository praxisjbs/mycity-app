# MyCity App · nginx, shared settings for the four hosts (docs/runbooks/proxy.md).
# Installed by ops/provision/provision.sh as /etc/nginx/conf.d/mycity.conf (http context).
# The host files (hub., go., hub.staging., go.staging.) carry only names and certificates;
# everything they share is here, so the four cannot drift apart.

server_tokens off;

# WebSocket upgrade on /socket.io/, and an empty Connection header for everything else so
# the upstream keep-alive below is used.
map $http_upgrade $mycity_connection {
    default upgrade;
    ""      "";
}

# One API process per environment serves both hosts of that environment (SYSTEM_ARCHITECTURE §3).
# keepalive_timeout stays under Node's 65 s, so nginx never reuses a socket Node has just closed.
upstream mycity_prod {
    server 127.0.0.1:7000;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream mycity_stg {
    server 127.0.0.1:7100;
    keepalive 16;
    keepalive_timeout 60s;
}

# Forwarding: every path goes to the API, which serves both frontend builds and refuses a
# path on the wrong host itself. No static root, no try_files, no proxy cache.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $http_x_request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $mycity_connection;
proxy_read_timeout 75s;
proxy_send_timeout 75s;

# The app caps an upload at 25 MB; the proxy must allow more, or uploads fail live with a 413.
client_max_body_size 30m;

# TLS for every host. Certificates are Let's Encrypt, renewed by certbot.timer.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:mycity_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=31536000" always;

# Listen options on one address must match across servers, hence http2 here too.
# Anything that is not one of the four hosts (the bare IP, a stray DNS name) gets nothing,
# except the Let's Encrypt challenge, which arrives here before a host's own file is enabled.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

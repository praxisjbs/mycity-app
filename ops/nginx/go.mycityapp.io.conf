# go.mycityapp.io · public site and public API, production (docs/runbooks/proxy.md).
# Shared settings: ops/nginx/mycity.conf.
# Installed by ops/provision/provision.sh into /etc/nginx/sites-available/ and enabled once
# its certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name go.mycityapp.io;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.mycityapp.io;

    ssl_certificate     /etc/letsencrypt/live/go.mycityapp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.mycityapp.io/privkey.pem;

    location / {
        proxy_pass http://mycity_prod;
    }
}

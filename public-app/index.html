<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Work with MyCity App. Open roles, and the pages a candidate is sent." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Careers · MyCity App</title>
    <script>
      /* Staging is marked from the first paint (lib/environment.ts in @mycity/ui). */
      if (/(^|\.)staging\./.test(location.hostname)) { document.documentElement.setAttribute("data-env", "staging"); var i = document.querySelector('link[rel="icon"]'); if (i) i.href = "/favicon-staging.svg"; }
      /* Theme before first paint: the visitor's own toggle if they set one, otherwise the device. */
      try { var t = localStorage.getItem("mc-public-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

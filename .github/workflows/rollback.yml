name: Rollback

# Switch production back to a release still on the server (the last five are kept), run by a
# production approver from main (SYSTEM_ARCHITECTURE §9.7, docs/runbooks/rollback.md). Required
# reviewers on the environment add a second person where the plan offers them; the approver job
# below holds while it does not (release.yml says why). The database
# is not rolled back: if the release being left migrated, restore its pre-deploy dump as the
# runbook says.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character sha of the production release to go back to"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  approver:
    name: Check the approver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Production approvers: GE and TB (SYSTEM_ARCHITECTURE §9.3). The same list is in release.yml.
      - name: Only a production approver, from main, with a full sha
        env:
          ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          SHA: ${{ inputs.sha }}
          APPROVERS: "swizfcodes tomblakeasaah196"
        run: |
          case " $APPROVERS " in
            *" $ACTOR "*) ;;
            *) echo "::error::$ACTOR is not a production approver (GE or TB)"; exit 1 ;;
          esac
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::run it from main, not $REF"; exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be the full 40 lowercase hex characters"; exit 1
          fi
          echo "$ACTOR rolls production back to ${SHA:0:12}"

  rollback:
    name: Roll production back
    needs: approver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://hub.mycityapp.io
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Load the production key
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Windows clipboards add CRLF line endings, which ssh cannot read ("error in libcrypto"):
          # strip them, then make sure the secret really is a private key before using it.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::PROD_SSH_KEY is not a usable private key. Paste the whole private file (not the .pub), from -----BEGIN to -----END, into the secret again."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: deploy-gate rollback
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_KEY_FILE: ~/.ssh/deploy_key
          SHA: ${{ inputs.sha }}
        run: bash scripts/deploy/rollback.sh "$SHA"

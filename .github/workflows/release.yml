name: Release

# Every green build of main goes to staging, is verified there and sealed. Production is a
# separate run of this workflow, started by hand by a production approver (SYSTEM_ARCHITECTURE §9,
# docs/runbooks/deploy.md).
#
#   after CI on main:   build ──► deploy-staging ──► verify-staging (seal)
#   run by hand:        approver ──► production (promote the sealed staging release)
#
# While the repository is private on a free plan, GitHub offers no required reviewers on an
# environment, so an automatic production job would run with nobody approving it
# (docs/runbooks/github-settings.md). Until that changes, production runs only when GE or TB start
# it from main with the sha staging runs; the approver job refuses anyone else. It is weaker than
# required reviewers: a change to this file can remove it, so the CODEOWNERS review of .github/
# is part of the control.
#
# The server is reached only through deploy-gate (scripts/deploy/deploy-gate), as mycity-deploy,
# whose keys are forced into it. The staging key can stage and seal; the production key can
# promote and roll back.
#
# Settings this needs (docs/runbooks/deploy.md §1):
#   environment staging      secret STAGING_SSH_KEY, deployment branch main
#   environment production   secret PROD_SSH_KEY, deployment branch main (and required reviewers
#                            GE and TB with self-review prevented, where the plan offers them)
#   repository variables     DEPLOY_HOST (108.181.196.53), DEPLOY_KNOWN_HOSTS (the server's
#                            ssh-keyscan line)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character sha of the release staging runs and has sealed"
        required: true
        type: string

# One release at a time, and never two at once with a rollback.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out the commit CI passed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Both apps are npm workspaces, installed by the root `npm ci` above (one lockfile). A plain
      # `vite build` is production mode with VITE_API_MODE unset: the live build, no mock (F12;
      # check/mock-free.js builds them the same way).
      - name: Build the staff app and the public site
        run: npm run build -w @mycity/app -w @mycity/public-app

      - name: Assemble the release and its manifest
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          RUN: ${{ github.run_id }}
        run: node scripts/deploy/release-manifest.js --out=release.tgz --sha="$SHA" --run="$RUN"

      - name: Keep the release for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 14
          if-no-files-found: error

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://hub.staging.mycityapp.io
    steps:
      - name: Fetch the release
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Load the staging key
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Windows clipboards add CRLF line endings, which ssh cannot read ("error in libcrypto"):
          # strip them, then make sure the secret really is a private key before using it.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::STAGING_SSH_KEY is not a usable private key. Paste the whole private file (not the .pub), from -----BEGIN to -----END, into the secret again."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      # The gate on the server is installed by hand and never by a release, so check it is the
      # one this commit carries before asking it to deploy; on a mismatch the job summary says
      # how to install it (scripts/deploy/check-gate.js, docs/runbooks/deploy.md §5).
      - name: Check out the release's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: repo

      - name: The server runs this commit's deploy-gate
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "mycity-deploy@$HOST" "status" > gate-status.txt
          node repo/scripts/deploy/check-gate.js --status=gate-status.txt --sha="$SHA" --host="$HOST"

      - name: deploy-gate stage
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "mycity-deploy@$HOST" "stage $SHA" < release.tgz

  verify-staging:
    name: Verify staging and seal
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://hub.staging.mycityapp.io
    steps:
      - name: Check out the release's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify staging over HTTPS
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: node scripts/deploy/verify-staging.js --sha="$SHA"

      - name: Load the staging key
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Windows clipboards add CRLF line endings, which ssh cannot read ("error in libcrypto"):
          # strip them, then make sure the secret really is a private key before using it.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::STAGING_SSH_KEY is not a usable private key. Paste the whole private file (not the .pub), from -----BEGIN to -----END, into the secret again."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: deploy-gate seal
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ needs.build.outputs.sha }}
          RUN: ${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "mycity-deploy@$HOST" "seal $SHA $RUN"

      - name: Say how to release it
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          {
            echo "### Staging is sealed on \`${SHA:0:12}\`"
            echo
            echo "To release it, a production approver tests staging, then runs **Release** from \`main\` (Actions, Run workflow) with this sha:"
            echo
            echo "\`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  approver:
    name: Check the approver
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Production approvers: GE and TB (SYSTEM_ARCHITECTURE §9.3). The same list is in rollback.yml.
      - name: Only a production approver, from main, with a full sha
        env:
          ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          SHA: ${{ inputs.sha }}
          APPROVERS: "swizfcodes tomblakeasaah196"
        run: |
          case " $APPROVERS " in
            *" $ACTOR "*) ;;
            *) echo "::error::$ACTOR is not a production approver (GE or TB)"; exit 1 ;;
          esac
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::run it from main, not $REF"; exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be the full 40 lowercase hex characters"; exit 1
          fi
          echo "$ACTOR releases ${SHA:0:12} to production"

  production:
    name: Production (run by an approver after testing staging)
    needs: approver
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Before running it: open hub.staging/api/health, check its build is this sha, and walk the
    # demo script for what this release touches (SYSTEM_ARCHITECTURE §9.8). deploy-gate still
    # refuses a sha that staging does not run or never sealed.
    environment:
      name: production
      url: https://hub.mycityapp.io
    permissions:
      contents: write
    steps:
      - name: Check out the release's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Load the production key
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Windows clipboards add CRLF line endings, which ssh cannot read ("error in libcrypto"):
          # strip them, then make sure the secret really is a private key before using it.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::PROD_SSH_KEY is not a usable private key. Paste the whole private file (not the .pub), from -----BEGIN to -----END, into the secret again."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: The server runs this commit's deploy-gate
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ inputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "mycity-deploy@$HOST" "status" > gate-status.txt
          node scripts/deploy/check-gate.js --status=gate-status.txt --sha="$SHA" --host="$HOST"

      - name: deploy-gate promote
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ inputs.sha }}
          RUN: ${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "mycity-deploy@$HOST" "promote $SHA $RUN"

      - name: Tag the release
        env:
          SHA: ${{ inputs.sha }}
        run: |
          tag="release-$(TZ=Africa/Lagos date +%Y%m%d-%H%M)-${SHA:0:12}"
          git tag "$tag" "$SHA"
          git push origin "$tag"

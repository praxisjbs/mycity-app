name: CI

# One job, one command: `npm run ci`, exactly what everyone runs locally
# (scripts/ci-local.js). Branch protection on main requires the "ci" check.
#
# This workflow never deploys and never references the production environment
# (check/production-environment-refs.js). Deploys are release.yml.

on:
  pull_request:
    branches: [main]
    # `edited`: the process gates read trailers from the PR description
    # ("Progress-unchanged: <reason>"). Without this, fixing the description
    # fires no event and the red run stands.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Run CI by hand on a ref an outage skipped. GitHub does not replay dropped
  # webhook events, and an empty commit to re-trigger would invent history.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # The screen gates and the a11y gate crawl the gallery and every app screen at two
    # sizes (about 7 minutes on a laptop); the margin keeps a slow runner from timing out.
    timeout-minutes: 30
    steps:
      - name: Check out (full history, the process gates diff against main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # One install for the backend and the workspaces (packages/*, app,
      # public-app): gates 8 and 11 build the staff app's mock build from it.
      - name: Install
        run: npm ci

      # Gates 8 and 11 open every screen at phone and desktop size
      # (scripts/check/lib/screens.js). The browser matches the pinned
      # playwright version in package-lock.json.
      - name: Chromium for the screen gates
        run: npx playwright install --with-deps chromium

      - name: All gates
        run: npm run ci
        env:
          # Every gate script is built (gate 6 was the last), so a gate whose script is
          # empty fails the run instead of being reported as NOT BUILT.
          CI_STRICT: "1"
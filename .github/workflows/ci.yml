name: CI

# Every gate in scripts/ci-local.js, the same command everyone runs locally (`npm run ci`), split
# into jobs that run side by side, so a run takes as long as its slowest job rather than the sum of
# them all (AJ, 19/10/2026; docs/BACKEND_GUIDE.md §8.4). The long ones are split again (GE,
# 06/11/2026): a run took 21 minutes behind one 16-minute job of tests on one runner, and now takes
# about six:
#
#   backend          PostgreSQL, Redis and ffmpeg: jest in 6 shards, each with its own database,
#                    the schema gates in the first (tests/shard-sequencer.js balances the files)
#   backend unit     jest without the database, when only the frontend changed (a few unit files
#                    read app/ and public-app/ source)
#   frontend         the workspaces' typecheck, lint and builds, and the mock check
#   frontend tests   the workspaces' vitest files in shards (scripts/fe-test.js, MYCITY_FE_TESTS)
#   screens          Chromium: the gates that open every screen, on the gallery and on the app
#                    (MYCITY_SCREEN_TARGETS, MYCITY_A11Y_TARGETS), their pages in shards
#                    (MYCITY_A11Y_SHARD, MYCITY_SCREEN_SHARD)
#   checks           the fast static and process gates, every gate that reads documents among them
#
# The scope job decides how many of each a run needs and hands the matrices over
# (scripts/check/lib/scope.js plan()); each job runs `npm run ci` with --group, --only or --except
# and the variables its entry sets, so a laptop with none of them set still runs every gate, whole.
# `node scripts/ci-local.js --groups` lists which gate is in which group. A last job named "ci"
# passes only when every job did, or was skipped because the run did not need it: branch
# protection on main requires that one check, so it keeps its name.
#
# Downloads that never change between runs are cached: npm's (setup-node), Chromium (keyed on the
# pinned playwright version), ffmpeg's packages (keyed on the runner image) and TypeScript's
# incremental state (the frontend job; never trusted as up to date, see there). More jobs bill more
# runner minutes, each its own install (about a minute), so the draft rule below matters more.
#
# This workflow never deploys and never references the production environment
# (check/production-environment-refs.js). Deploys are release.yml.
#
# Each run does only what its change needs (TB, 19/10/2026: a week of CI used GitHub's monthly
# Actions minutes in under three days; docs/BACKEND_GUIDE.md §8.4):
#   - a draft pull request runs nothing: its author runs `npm run ci` while working, and the run
#     starts when it is marked ready (ready_for_review), then on every push
#   - a change to documents only, or a push to main whose tree a pull request's run already
#     passed, runs only the gates that read documents (scripts/check/lib/scope.js): the checks
#     job alone; every other job is skipped and starts no runner
#   - otherwise a pull request runs the sets its files can affect (GE, 06/11/2026): one touching
#     only app/ skips packages/ui's and public-app's tests and the gallery's screens, one touching
#     only src/ skips every frontend job; packages/, scripts/, root config, the lockfile and
#     .github/ run everything. A push to main or a run by hand runs everything

on:
  pull_request:
    branches: [main]
    # `edited`: the process gates read trailers from the PR description
    # ("Progress-unchanged: <reason>"). Without this, fixing the description
    # fires no event and the red run stands. Only a changed description or base
    # runs CI again (the job's `if`); a new title changes no gate's answer.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # Run CI by hand on a ref an outage skipped. GitHub does not replay dropped
  # webhook events, and an empty commit to re-trigger would invent history.
  workflow_dispatch:

# A run that does no work (on a draft, or after an edit to the title alone: the scope job's
# condition below) has a group of its own, so it never cancels a run that does (27/10/2026).
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' && (github.event.pull_request.draft ||
    (github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base)))
    && format('ci-{0}-idle-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # On a push to main the process gates read the merged PR's description for its trailers
  # ("Guide-unchanged: <reason>"); GitHub sends none with a push event.
  pull-requests: read
  # On a push to main, the scope step reads the merged pull request's CI runs and the tree
  # each one passed (the ci-tree artifact).
  actions: read

env:
  # Every gate script is built (gate 6 was the last), so a gate whose script is
  # empty fails the run instead of being reported as NOT BUILT.
  CI_STRICT: "1"

jobs:
  # full, docs or tested, and why; the sets this run needs and each job matrix (printed in the
  # log). Needs nothing installed.
  scope:
    name: scope
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.body || github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      backend: ${{ steps.scope.outputs.backend }}
      backend_unit: ${{ steps.scope.outputs.backend_unit }}
      frontend: ${{ steps.scope.outputs.frontend }}
      frontend_tests: ${{ steps.scope.outputs.frontend_tests }}
      screens: ${{ steps.scope.outputs.screens }}
      all: ${{ steps.scope.outputs.all }}
    steps:
      - name: Check out (full history, the scope diffs against main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: How much this run needs
        id: scope
        run: node scripts/ci-local.js --decide-scope
        env:
          GH_TOKEN: ${{ github.token }}

  # jest's integration files share one database and run one at a time: 16 minutes in one job on
  # one CPU. Each shard has its own PostgreSQL and Redis, so the shards cannot meet.
  backend:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.backend != '[]'
    runs-on: ubuntu-latest
    # A shard's own work is about three minutes; the margin keeps a slow runner from timing out.
    timeout-minutes: 12
    strategy:
      # Every shard reports, so five unrelated failures are five lines in one run, not five runs.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.backend) }}
    # A real PostgreSQL 16 with pgvector and Redis, so the integration suite and gate 4's round
    # trip run the shared layer against the real migrations on every PR (docs/MIGRATIONS.md §12).
    # A throwaway database for CI only; nothing here is staging or production.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mycity
          POSTGRES_PASSWORD: mycity
          POSTGRES_DB: mycity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mycity -d mycity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out (full history, the migration gates diff against main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci

      # The integration suite transcodes voice notes and reads media durations. The .deb files
      # are kept between runs, keyed on the runner image: its package lists decide which versions
      # apt wants, so a new image saves a fresh set instead of downloading on every run (a fixed
      # key never saved again, and on 23/10/2026 a slow mirror ran the whole 94 MB past the job's
      # limit). A new image starts from the last image's files and fetches only what changed.
      # The runner's apt mirror can stall part way through a download (06/11/2026: 21 MB of
      # Chromium's libraries for five minutes, in two runs). The capped try then ended npx but not
      # the apt-get under it, whose lock failed the second try at once. A stalled fetch now times
      # out and is fetched again, and apt waits for its lock rather than failing on it.
      - name: apt retries a stalled mirror and waits for its lock
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci-mirror >/dev/null
      - name: Which runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg's packages, cached
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}
          restore-keys: ffmpeg-${{ runner.os }}-${{ runner.arch }}-
      - name: ffmpeg for the integration suite
        run: |
          if ls ~/ffmpeg-debs/*.deb >/dev/null 2>&1 && sudo apt-get install -y -q --no-download ~/ffmpeg-debs/*.deb; then
            echo "ffmpeg from the cache"
          else
            # Files whose version the lists still name are used as they are; apt fetches the rest.
            sudo cp ~/ffmpeg-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg
            # Versions no list names any more are dropped, so the cache does not grow each image.
            sudo apt-get autoclean -q
            rm -rf ~/ffmpeg-debs && mkdir -p ~/ffmpeg-debs
            cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/ 2>/dev/null || true
          fi
          ffmpeg -version | head -1

      # The job prints the service's log after its steps, and the transaction probe in
      # src/shared/db/tx.js has PostgreSQL log an ERROR on every call outside a transaction:
      # thousands of lines that buried the failing test at the end of each red backend log
      # (27/10/2026). From here it logs fatal errors only. A warning, never a failure, if it cannot.
      - name: PostgreSQL logs fatal errors only
        run: |
          node -e '
            const { Client } = require("pg");
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            (async () => {
              await db.connect();
              await db.query("ALTER SYSTEM SET log_min_messages = fatal");
              await db.query("ALTER SYSTEM SET log_min_error_statement = panic");
              await db.query("SELECT pg_reload_conf()");
              await db.end();
            })().catch((e) => console.log(`::warning::PostgreSQL keeps logging errors: ${e.message}`));
          '
        env:
          DATABASE_URL: postgres://mycity:mycity@127.0.0.1:5432/mycity_test

      # The first shard runs `--group=backend` (its slice of jest and the schema gates), the
      # others `--only=test`; MYCITY_JEST_SHARD is the slice.
      - name: Backend gates
        run: npm run ci -- ${{ matrix.gates }}
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          MYCITY_JEST_SHARD: ${{ matrix.shard }}
          # Integration suite and gate 4's live round trip, against the services above.
          RUN_DB_TESTS: "1"
          APP_ENV: test
          DATABASE_URL: postgres://mycity:mycity@127.0.0.1:5432/mycity_test
          REDIS_URL: redis://127.0.0.1:6379/15
          GH_TOKEN: ${{ github.token }}

  # A change to app/ or public-app/ alone cannot reach the API, but a few of jest's unit files read
  # their source (new-screen, check-frontend-gates): those run, without a database (20 s).
  backend-unit:
    name: backend unit
    needs: scope
    if: needs.scope.outputs.backend_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: jest without the database
        run: npm run ci -- --only=test
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          APP_ENV: test
          GH_TOKEN: ${{ github.token }}

  frontend:
    name: frontend
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci

      # TypeScript's incremental state (the .tsbuildinfo files each workspace keeps under its
      # node_modules/.tmp), so typecheck checks again only what changed: about 20 s warm, 100 s
      # cold. Restored after the install, which empties node_modules. The key moves with every
      # commit, so each run saves the state it ended with; a new lockfile starts cold.
      - name: TypeScript's incremental state, cached
        uses: actions/cache@v4
        with:
          path: |
            packages/ui/node_modules/.tmp
            app/node_modules/.tmp
            public-app/node_modules/.tmp
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # A stale state must never hide an error. A restored state is newer than the checkout, and
      # `tsc -b` may take a project whose state is newer than its files as up to date: dated
      # 1970, every project is always checked again. The state then only spares work: TypeScript
      # reuses a file's result only when its text, and the text of everything it depends on,
      # hashes the same as when the result was kept (tried on 06/11/2026: an error in a file that
      # did not change, from a type that did, is still reported from a restored state).
      - name: The cached state is never taken as up to date
        run: find packages/ui/node_modules/.tmp app/node_modules/.tmp public-app/node_modules/.tmp -name '*.tsbuildinfo' -exec touch -d @0 {} + 2>/dev/null || true

      # Every frontend gate but the tests, which the next job runs in shards.
      - name: Frontend gates (typecheck, lint, build, mock check)
        run: npm run ci -- --group=frontend --except=fe-test
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          GH_TOKEN: ${{ github.token }}

  # The three workspaces' vitest files took 16 minutes side by side on one 4-core runner; vitest's
  # own shards of each workspace (scripts/fe-test.js) spread them over several.
  frontend-tests:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.frontend_tests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.frontend_tests) }}
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Frontend tests
        run: npm run ci -- --only=fe-test
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          MYCITY_FE_TESTS: ${{ matrix.tests }}
          GH_TOKEN: ${{ github.token }}

  # The screen gates open the gallery and the app; each job opens one of them (a11y alone took 11
  # minutes over both), builds only that one, and axe's share of its pages.
  screens:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.screens != '[]'
    runs-on: ubuntu-latest
    # The gates crawl one target at two sizes (a few minutes); the margin covers a cold Chromium
    # install, which may take its two capped tries.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.screens) }}
    steps:
      - name: Check out (full history, the screen gates read what changed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci

      # Gates 8, 11 and 21 open every screen at phone and desktop size
      # (scripts/check/lib/screens.js). The browser matches the pinned playwright version in
      # package-lock.json, so that version is the cache key: Chromium downloads once per upgrade.
      - name: Which Chromium
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Chromium, cached
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # Chromium's system libraries come from the runner's apt mirror, nine screen jobs at once:
      # one job of the first sharded run waited out both capped tries (06/11/2026). Their .deb
      # files are kept between runs as ffmpeg's are, keyed on the runner image and the browser.
      # The runner's apt mirror can stall part way through a download (06/11/2026: 21 MB of
      # Chromium's libraries for five minutes, in two runs). The capped try then ended npx but not
      # the apt-get under it, whose lock failed the second try at once. A stalled fetch now times
      # out and is fetched again, and apt waits for its lock rather than failing on it.
      - name: apt retries a stalled mirror and waits for its lock
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci-mirror >/dev/null
      - name: Which runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Chromium's system libraries, cached
        id: chromium-debs
        uses: actions/cache@v4
        with:
          path: ~/chromium-debs
          key: chromium-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ steps.playwright.outputs.version }}

      # Both install through the runner's apt mirror, which once hung 14 minutes and took the run
      # with it (26/10/2026): each try is capped, a second follows, then the step fails saying so.
      - name: Chromium for the screen gates
        if: steps.chromium.outputs.cache-hit != 'true'
        timeout-minutes: 22
        run: |
          for attempt in 1 2; do
            timeout 600 npx playwright install --with-deps chromium && exit 0
            echo "::warning::Installing Chromium did not finish (try $attempt of 2)"
            # The cap ends npx, not the apt-get it started: stop that one and let it go before the next try.
            sudo pkill -x apt-get || true
            for _ in $(seq 30); do pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break; sleep 2; done
            sudo dpkg --configure -a || true
          done
          echo "::error::Chromium could not be installed in two tries: its download or the runner's apt mirror stalled each time. Re-run the job."
          exit 1
      # The browser comes from the cache; the system libraries it needs from theirs when it holds
      # them, else from the mirror, and what the mirror sent is kept for the next run.
      - name: Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: |
          if ls ~/chromium-debs/*.deb >/dev/null 2>&1 && sudo apt-get install -y -q --no-download ~/chromium-debs/*.deb; then
            echo "Chromium's system libraries from the cache"; exit 0
          fi
          for attempt in 1 2; do
            if timeout 300 npx playwright install-deps chromium; then
              mkdir -p ~/chromium-debs && cp /var/cache/apt/archives/*.deb ~/chromium-debs/ 2>/dev/null || true
              exit 0
            fi
            echo "::warning::Installing Chromium's system libraries did not finish (try $attempt of 2)"
            # The cap ends npx, not the apt-get it started: stop that one and let it go before the next try.
            sudo pkill -x apt-get || true
            for _ in $(seq 30); do pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break; sleep 2; done
            sudo dpkg --configure -a || true
          done
          echo "::error::Chromium's system libraries could not be installed in two tries: the runner's apt mirror stalled each time. Re-run the job."
          exit 1

      # The screen gates on this job's target: the crawl (lib/screens.js) and axe (a11y.js) open
      # only it, and only this job's share of its pages. The gallery's first job crawls it whole
      # (`--group=screens`, the gates' static reads of the source among them), its others run
      # `--only=a11y`; every app job runs every screen gate on its share of the screens.
      - name: Screen gates
        run: npm run ci -- ${{ matrix.gates }}
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          MYCITY_SCREEN_TARGETS: ${{ matrix.targets }}
          MYCITY_A11Y_TARGETS: ${{ matrix.a11y }}
          MYCITY_A11Y_SHARD: ${{ matrix.a11y_shard }}
          MYCITY_SCREEN_SHARD: ${{ matrix.screen_shard }}
          GH_TOKEN: ${{ github.token }}

  checks:
    name: checks
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history, the process gates diff against main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Static and process gates
        run: npm run ci -- --group=checks
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          GH_TOKEN: ${{ github.token }}

  # The one check branch protection requires: green only when every job above passed, or was
  # skipped because this run's scope did not need it. A cancelled run reports cancelled, not a
  # failed ci (always() did); the newer run that cancelled it reports for the commit.
  ci:
    name: ci
    needs: [scope, backend, backend-unit, frontend, frontend-tests, screens, checks]
    if: ${{ !cancelled() && needs.scope.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, n]) => !["success", "skipped"].includes(n.result));
            for (const [job, n] of Object.entries(needs)) console.log(`${job.padEnd(15)} ${n.result}`);
            if (needs.scope.result !== "success" || needs.checks.result !== "success" || bad.length) process.exit(1);
          '

      # The tree this pull request's run passed (GitHub's merge of it into main as main is now),
      # kept only when the run ran every set: after the merge, main's run finds it and skips what
      # this tree already passed (scripts/check/lib/scope.js, TREE_ARTIFACT and TREE_FILE). A run
      # that skipped sets its change could not affect leaves none, so main runs everything once.
      - name: Check out (only to read the tree)
        if: success() && github.event_name == 'pull_request' && needs.scope.outputs.all == 'true'
        uses: actions/checkout@v4
      - name: Record the tree this run passed
        if: success() && github.event_name == 'pull_request' && needs.scope.outputs.all == 'true'
        run: git rev-parse 'HEAD^{tree}' > ci-tree.txt
      - name: Keep it for main's run after the merge
        if: success() && github.event_name == 'pull_request' && needs.scope.outputs.all == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-tree
          path: ci-tree.txt
          retention-days: 14

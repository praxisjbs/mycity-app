<img class="bleed" src="{{ photo }}" alt="{{ photo_alt }}">
<div class="scrim scrim--cover"></div>
<header class="marks">{{#if mark}}<img class="mark" src="{{ mark }}" alt="{{ org_name }}">{{else}}<span class="wordmark"><svg class="pin" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 0C4.9 0 0 4.8 0 10.8 0 18.6 11 28 11 28s11-9.4 11-17.2C22 4.8 17.1 0 11 0Z"/><circle cx="11" cy="10.6" r="4"/></svg><span>{{ org_name }}</span></span>{{/if}}{{#if logo}}<span class="marks-sep"></span><span class="partner-logo"><img src="{{ logo }}" alt="{{ logo_alt }}"></span>{{/if}}</header>
<div class="cover-body">
  <h1 class="display {{ size }}">{{ title }}</h1>
  <dl class="cover-meta">
    <div><dt>Prepared for</dt><dd>{{ prepared_for }}</dd></div>
    <div><dt>Date</dt><dd>{{ longdate date }}</dd></div>
    <div><dt>Reference</dt><dd>{{ reference }}</dd></div>
  </dl>
</div>
<div class="cover-route" aria-hidden="true"><svg class="pin" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 0C4.9 0 0 4.8 0 10.8 0 18.6 11 28 11 28s11-9.4 11-17.2C22 4.8 17.1 0 11 0Z"/><circle cx="11" cy="10.6" r="4"/></svg></div>

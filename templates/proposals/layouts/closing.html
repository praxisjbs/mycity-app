{{#if photo}}<img class="bleed" src="{{ photo }}" alt="{{ photo_alt }}"><div class="scrim scrim--closing"></div>{{/if}}
<div class="closing-body">
  <header class="marks">{{#if mark}}<img class="mark" src="{{ mark }}" alt="{{ org_name }}">{{else}}<span class="wordmark"><svg class="pin" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 0C4.9 0 0 4.8 0 10.8 0 18.6 11 28 11 28s11-9.4 11-17.2C22 4.8 17.1 0 11 0Z"/><circle cx="11" cy="10.6" r="4"/></svg><span>{{ org_name }}</span></span>{{/if}}{{#if logo}}<span class="marks-sep"></span><span class="partner-logo"><img src="{{ logo }}" alt="{{ logo_alt }}"></span>{{/if}}</header>
  {{#if message}}<p class="closing-message">{{ message }}</p>{{/if}}
  <div class="closing-foot"><svg class="pin" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 0C4.9 0 0 4.8 0 10.8 0 18.6 11 28 11 28s11-9.4 11-17.2C22 4.8 17.1 0 11 0Z"/><circle cx="11" cy="10.6" r="4"/></svg><span>{{ website }}</span></div>
</div>
{{#if visual}}<div class="closing-illus">{{> body}}</div>{{/if}}

<figure class="chart chart--{{ kind }}"><figcaption class="chart-title">{{ title }}</figcaption><svg viewBox="0 0 {{ w }} {{ h }}" role="img" aria-label="{{ aria }}" preserveAspectRatio="xMidYMid meet">{{#each grid}}<line class="c-grid" x1="{{ x1 }}" y1="{{ y1 }}" x2="{{ x2 }}" y2="{{ y2 }}"/>{{/each}}{{#each rects}}<rect class="c-s{{ s }}" x="{{ x }}" y="{{ y }}" width="{{ rw }}" height="{{ rh }}" rx="{{ r }}"/>{{/each}}{{#each paths}}<path class="{{ cls }}" d="{{ d }}" stroke-width="{{ sw }}"/>{{/each}}{{#each dots}}<circle class="c-dot c-s{{ s }}" cx="{{ cx }}" cy="{{ cy }}" r="{{ cr }}"/>{{/each}}{{#each texts}}<text class="{{ cls }}" x="{{ tx }}" y="{{ ty }}" text-anchor="{{ anchor }}">{{ text }}</text>{{/each}}</svg>{{#if legend}}<ul class="chart-legend">{{#each legend}}<li><i class="c-key c-s{{ s }}"></i>{{ name }}</li>{{/each}}</ul>{{/if}}</figure>

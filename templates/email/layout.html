<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F4F4F5;font-family:Helvetica,Arial,sans-serif;color:#09090B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F4F5;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border-radius:12px;overflow:hidden;">
      {{#if staging}}
      <tr><td style="background:#DA1E10;color:#FFFFFF;font-size:12px;font-weight:700;text-align:center;padding:6px 12px;">STAGING. This message came from the test system, not live MyCity App.</td></tr>
      {{/if}}
      <tr><td style="background:#01221D;padding:18px 24px;">
        <span style="font-size:20px;font-weight:700;color:#FFFFFF;">MyCityApp</span>
      </td></tr>
      <tr><td style="height:4px;background:#FFDF55;font-size:0;line-height:0;">&nbsp;</td></tr>
      <tr><td style="padding:28px 24px;font-size:15px;line-height:1.6;color:#09090B;">
        {{> body}}
      </td></tr>
      <tr><td style="padding:16px 24px;border-top:1px solid #E4E4E7;font-size:12px;line-height:1.5;color:#71717A;">
        {{ org.name }}{{#if org.address}} · {{ org.address }}{{/if}}<br>
        This is an automatic message from MyCity App. {{#if org.email}}For help, write to {{ org.email }}.{{/if}}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
